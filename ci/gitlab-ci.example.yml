# ==============================================================================
# GitLab CI/CD Pipeline Template: Merge Request Architectural Compliance Checker
# ==============================================================================
# This template demonstrates how to integrate the MR compliance checker into your
# GitLab CI pipeline with native Code Quality reports and automated MR discussions.

stages:
  - compliance

architectural_compliance_check:
  stage: compliance
  image: python:3.11-slim
  rules:
    # Trigger only on Merge Request pipelines
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GEMINI_MODEL: "gemini-3.5-flash-lite"
    GIT_DEPTH: "0" # Full git history to compare branch against target
  before_script:
    - apt-get update && apt-get install -y git
    - pip install --upgrade pip
    # Clone the central review engine using GitLab CI Job Token
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/debbiswas2002/mr-validation.git /tmp/mr-validation
    - pip install -r /tmp/mr-validation/requirements.txt
  script:
    # 1. Fetch target branch (e.g. main)
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    # 2. Run the compliance review with Code Quality JSON artifact and MR Bot comments
    - >
      python /tmp/mr-validation/cli_local.py
      --branch "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      --rules /tmp/mr-validation/rules/architecture.md
      --export-codequality gl-code-quality-report.json
      --post-gitlab-comments
  allow_failure: true # Set to false to strictly block non-compliant MRs from merging
  artifacts:
    when: always
    reports:
      # Native GitLab Code Quality MR widget integration
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    expire_in: 7 days
